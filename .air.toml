root = "."
tmp_dir = ".tmp/air"

[build]
cmd = "go build -o .tmp/air/airbrew ./cmd/airbrew"
entrypoint = [".tmp/air/airbrew"]
include_ext = ["go", "mod", "sum"]
include_dir = ["cmd", "internal", "web"]
exclude_dir = [".tmp", "bin", "web/node_modules", "web/dist"]
delay = 1000
stop_on_error = true

[misc]
clean_on_exit = true
